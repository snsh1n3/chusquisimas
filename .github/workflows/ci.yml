name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias (lockfile exacto)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Pruebas unitarias
        run: npm test
      - name: Esquema SQLite local y catálogo inicial
        run: python3 tests/integration/check_sqlite_schema.py
      - name: Transacciones administrativas auditadas
        run: python3 tests/integration/check_admin_transactions.py
      - name: Eliminación segura de productos archivados
        run: python3 tests/integration/check_safe_delete.py
      - name: RBAC con D1 como fuente única
        run: python3 tests/integration/check_rbac_seed.py
      - name: Seed de pebeteros (idempotente y cuadrado)
        run: python3 tests/integration/check_pebeteros_seed.py
      - name: Aislamiento del despliegue
        run: python3 tests/integration/check_deployment_gate.py
      - name: Build
        run: npm run build

  smoke:
    name: Prueba de humo del Worker (OpenNext + wrangler dev)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias (lockfile exacto)
        run: npm ci
      - name: Build de OpenNext y rutas clave en el runtime local de Workers
        run: bash scripts/smoke-test.sh

  dependency-review:
    name: Revisión de dependencias nuevas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

name: Sincronizar lockfile

# Regenera package-lock.json a partir de package.json en una rama de trabajo
# (nunca en main) y lo sube como commit. Sirve cuando el cambio de dependencias
# ya fue aprobado y se prepara desde un entorno sin npm. Luego la rama pasa por
# CI en un pull request antes de fusionarse.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Sin credenciales en .git/config mientras corre npm: el token de escritura
      # solo existe en el paso final de push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Resolver dependencias sin instalar ni ejecutar scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Subir el lockfile actualizado
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "El lockfile ya estaba sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): sincronizar package-lock.json"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"
